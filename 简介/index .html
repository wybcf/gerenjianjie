<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="description" content="吴一博 · 应急管理 / 公共安全 / 风险管理 / 数据分析 / AI 应用 · 个人简历">
<title>吴一博 · 个人简历</title>
<style>
/* ============ 基础与变量 ============ */
*,*::before,*::after{ box-sizing:border-box; }

:root{
  --brand:#4f46e5;
  --brand-2:#0ea5e9;
  --bg:#f4f7fd;
  --surface:#ffffff;
  --surface-2:#eaeff9;
  --text:#0f172a;
  --muted:#5c6b85;
  --border:rgba(15,23,42,.09);
  --nav-bg:rgba(255,255,255,.78);
  --shadow:0 6px 20px rgba(15,23,42,.06);
  --shadow-hover:0 16px 36px rgba(15,23,42,.12);
  --radius:16px;
  --grad:linear-gradient(135deg,#4f46e5,#0ea5e9);
}

[data-theme="dark"]{
  --brand:#8b9bff;
  --brand-2:#4cc3f7;
  --bg:#070c16;
  --surface:#101828;
  --surface-2:#18233a;
  --text:#e8eefb;
  --muted:#93a3bd;
  --border:rgba(255,255,255,.09);
  --nav-bg:rgba(10,16,28,.78);
  --shadow:0 6px 20px rgba(0,0,0,.35);
  --shadow-hover:0 16px 36px rgba(0,0,0,.5);
}

html{
  scroll-behavior:smooth;
  scroll-padding-top:78px;
  -webkit-text-size-adjust:100%;
}

body{
  margin:0;
  min-height:100vh;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Source Han Sans SC",system-ui,sans-serif;
  font-size:15px;
  line-height:1.7;
  color:var(--text);
  background-color:var(--bg);
  background-image:
    radial-gradient(900px 520px at 8% -10%, rgba(79,70,229,.16), transparent 62%),
    radial-gradient(820px 480px at 96% -2%, rgba(14,165,233,.14), transparent 60%),
    radial-gradient(760px 700px at 50% 122%, rgba(79,70,229,.07), transparent 65%);
  background-attachment:fixed;
  transition:background-color .3s ease, color .3s ease;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}

[data-theme="dark"] body{
  background-image:
    radial-gradient(900px 520px at 8% -10%, rgba(99,102,241,.20), transparent 62%),
    radial-gradient(820px 480px at 96% -2%, rgba(56,189,248,.13), transparent 60%),
    radial-gradient(760px 700px at 50% 122%, rgba(99,102,241,.10), transparent 65%);
}

a{ color:inherit; }

:focus-visible{
  outline:2px solid var(--brand);
  outline-offset:2px;
  border-radius:8px;
}

/* ============ 顶部导航 ============ */
.nav{
  position:fixed; top:0; left:0; right:0; z-index:60;
  background:var(--nav-bg);
  backdrop-filter:blur(16px) saturate(180%);
  -webkit-backdrop-filter:blur(16px) saturate(180%);
  border-bottom:1px solid var(--border);
  transition:background-color .3s ease, border-color .3s ease;
}

.nav-inner{
  max-width:1080px;
  margin:0 auto;
  height:60px;
  padding:0 20px;
  display:flex;
  align-items:center;
  gap:14px;
}

.brand{
  display:flex; align-items:center; gap:9px;
  font-weight:800; font-size:15px; letter-spacing:.01em;
  text-decoration:none; white-space:nowrap;
}

.brand-mark{
  position:relative;
  width:22px; height:22px; border-radius:7px;
  background:var(--grad);
  box-shadow:0 4px 12px rgba(79,70,229,.4);
  flex:0 0 auto;
}
.brand-mark::after{
  content:"";
  position:absolute; inset:6px;
  border-radius:2px;
  background:rgba(255,255,255,.92);
  clip-path:polygon(0 0,100% 0,100% 34%,34% 34%,34% 100%,0 100%);
}

.nav-links{
  display:flex; align-items:center; gap:2px;
  margin-left:auto;
  min-width:0;
  overflow-x:auto;
  scrollbar-width:none;
}
.nav-links::-webkit-scrollbar{ display:none; }

.nav-link{
  padding:7px 11px;
  border-radius:9px;
  font-size:13.5px;
  font-weight:600;
  color:var(--muted);
  text-decoration:none;
  white-space:nowrap;
  transition:background .18s ease, color .18s ease;
}
.nav-link:hover{ color:var(--text); background:var(--surface-2); }
.nav-link.active{
  color:#fff;
  background:var(--grad);
  box-shadow:0 4px 12px rgba(79,70,229,.32);
}

.nav-actions{
  display:flex; gap:8px; margin-left:8px; flex:0 0 auto;
}

.icon-btn{
  width:36px; height:36px;
  display:grid; place-items:center;
  border-radius:10px;
  border:1px solid var(--border);
  background:var(--surface);
  color:var(--text);
  cursor:pointer;
  padding:0;
  transition:transform .18s ease, box-shadow .18s ease, background .18s ease, border-color .18s ease;
}
.icon-btn:hover{ transform:translateY(-1px); box-shadow:var(--shadow); }
.icon-btn:active{ transform:translateY(0); }
.icon-btn svg{ width:18px; height:18px; display:block; }

/* ============ 布局 ============ */
.wrap{
  max-width:1080px;
  margin:0 auto;
  padding:88px 20px 48px;
}

.section{ margin-top:54px; }

.section-head{
  display:flex;
  align-items:baseline;
  gap:12px;
  flex-wrap:wrap;
  margin-bottom:18px;
}

.section-title{
  margin:0;
  font-size:19px;
  font-weight:800;
  letter-spacing:-.01em;
  display:inline-flex;
  align-items:center;
  gap:10px;
}
.section-title::before{
  content:"";
  width:4px; height:17px;
  border-radius:99px;
  background:linear-gradient(180deg,#4f46e5,#0ea5e9);
  flex:0 0 auto;
}

.section-sub{
  margin:0;
  font-size:13px;
  color:var(--muted);
}

/* ============ 卡片 ============ */
.card{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  transition:transform .2s cubic-bezier(.22,.8,.3,1), box-shadow .2s ease, border-color .2s ease, background-color .3s ease;
}
.card:hover{
  transform:translateY(-3px);
  box-shadow:var(--shadow-hover);
}

/* ============ Hero ============ */
.hero{ margin-bottom:8px; }

.hero-card{
  position:relative;
  overflow:hidden;
  display:flex;
  gap:26px;
  align-items:flex-start;
  padding:30px;
}
.hero-card::before{
  content:"";
  position:absolute;
  inset:0 0 auto 0;
  height:3px;
  background:linear-gradient(90deg,#4f46e5,#0ea5e9,#22d3ee);
}
.hero-card::after{
  content:"";
  position:absolute;
  right:-90px; bottom:-120px;
  width:320px; height:320px;
  border-radius:50%;
  background:radial-gradient(circle at 35% 35%, rgba(79,70,229,.22), rgba(14,165,233,.06) 55%, transparent 72%);
  pointer-events:none;
}
.hero-card:hover{ transform:none; }

.avatar{
  width:96px; height:96px;
  flex:0 0 auto;
  border-radius:24px;
  overflow:hidden;
  box-shadow:0 12px 28px rgba(79,70,229,.30);
  position:relative;
  z-index:1;
  background:var(--grad);
  border:1px solid var(--border);
}
.avatar img{
  width:100%; height:100%;
  object-fit:cover;
  object-position:center top;
  display:block;
}
.avatar.is-fallback img{ display:none; }
.avatar.is-fallback::after{
  content:"吴";
  position:absolute;
  inset:0;
  display:grid;
  place-items:center;
  font-size:34px;
  font-weight:800;
  color:rgba(255,255,255,.94);
}

.hero-body{ flex:1 1 auto; min-width:0; position:relative; z-index:1; }

.hero-name{
  margin:0;
  font-size:32px;
  font-weight:800;
  letter-spacing:-.02em;
  line-height:1.24;
}

.hero-tag{
  margin:8px 0 0;
  font-size:14px;
  font-weight:700;
  color:var(--brand);
  letter-spacing:.01em;
}

.hero-intro{
  margin:12px 0 0;
  font-size:14px;
  color:var(--muted);
  line-height:1.78;
  max-width:66ch;
}

.meta-row{
  display:flex; flex-wrap:wrap; gap:8px;
  margin-top:14px;
}

.meta-chip{
  font-size:12.5px;
  color:var(--muted);
  padding:4px 10px;
  border-radius:99px;
  background:var(--surface-2);
  border:1px solid var(--border);
}

.kw-row{
  display:flex; flex-wrap:wrap; gap:8px;
  margin-top:18px;
}

.kw{
  font-size:12.5px;
  font-weight:600;
  padding:5px 12px;
  border-radius:99px;
  color:var(--brand);
  background:var(--surface-2);
  border:1px solid var(--border);
  transition:transform .18s ease, border-color .18s ease;
}
.kw:hover{ transform:translateY(-1px); border-color:var(--brand); }

.hero-actions{
  display:flex; flex-wrap:wrap; gap:10px;
  margin-top:20px;
}

/* ============ 按钮 ============ */
.btn{
  display:inline-flex;
  align-items:center;
  gap:8px;
  padding:9px 16px;
  border-radius:11px;
  font-family:inherit;
  font-size:13.5px;
  font-weight:600;
  border:1px solid var(--border);
  background:var(--surface);
  color:var(--text);
  text-decoration:none;
  cursor:pointer;
  transition:transform .18s ease, box-shadow .18s ease, border-color .18s ease, background .18s ease;
}
.btn:hover{
  transform:translateY(-2px);
  box-shadow:var(--shadow-hover);
  border-color:transparent;
}
.btn:active{ transform:translateY(0); }
.btn svg{ width:16px; height:16px; display:block; flex:0 0 auto; }

.btn-primary{
  background:var(--grad);
  color:#fff;
  border-color:transparent;
  box-shadow:0 6px 18px rgba(79,70,229,.32);
}
.btn-primary:hover{ box-shadow:0 12px 28px rgba(79,70,229,.42); }

.btn .copy-hint{
  font-size:11px;
  font-weight:600;
  color:var(--muted);
  padding-left:6px;
  margin-left:2px;
  border-left:1px solid var(--border);
}

/* ============ 亮点 ============ */
.hl-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit, minmax(210px, 1fr));
  gap:16px;
}

.hl-card{ padding:20px; }

.hl-value{
  font-size:24px;
  font-weight:800;
  letter-spacing:-.02em;
  line-height:1.3;
  background:var(--grad);
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
  -webkit-text-fill-color:transparent;
}

.hl-label{
  margin-top:4px;
  font-size:14px;
  font-weight:700;
}

.hl-desc{
  margin-top:6px;
  font-size:13px;
  line-height:1.65;
  color:var(--muted);
}

/* ============ Tabs ============ */
.tabbar{
  display:flex;
  flex-wrap:wrap;
  gap:6px;
  padding:5px;
  margin-bottom:18px;
  border-radius:13px;
  background:var(--surface-2);
  border:1px solid var(--border);
}

.tab{
  appearance:none;
  border:0;
  background:transparent;
  font-family:inherit;
  font-size:13.5px;
  font-weight:600;
  color:var(--muted);
  padding:8px 15px;
  border-radius:9px;
  cursor:pointer;
  transition:background .18s ease, color .18s ease, box-shadow .18s ease, transform .18s ease;
}
.tab:hover{ color:var(--text); }
.tab[aria-selected="true"]{
  color:#fff;
  background:var(--grad);
  box-shadow:0 4px 14px rgba(79,70,229,.32);
}
.tab[aria-selected="true"]:hover{ color:#fff; }

.tabpanel{ outline:none; }

/* ============ 经历 ============ */
.exp-item{
  padding:20px 22px;
  margin-bottom:14px;
}
.exp-item:last-child{ margin-bottom:0; }

.exp-top{
  display:flex;
  justify-content:space-between;
  align-items:baseline;
  gap:12px;
  flex-wrap:wrap;
}

.exp-role{
  margin:0;
  font-size:15.5px;
  font-weight:700;
}

.exp-org{
  margin-top:3px;
  font-size:13.5px;
  font-weight:700;
  color:var(--brand);
}

.exp-time{
  font-size:12.5px;
  color:var(--muted);
  white-space:nowrap;
}

.exp-points{
  margin:12px 0 0;
  padding-left:18px;
}
.exp-points li{
  font-size:13.5px;
  color:var(--muted);
  margin-bottom:6px;
}
.exp-points li:last-child{ margin-bottom:0; }
.exp-points li::marker{ color:var(--brand); }

/* ============ 空状态 ============ */
.empty{
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:8px;
  text-align:center;
  padding:46px 20px;
  border:1px dashed var(--border);
  border-radius:var(--radius);
  background:var(--surface);
}
.empty svg{ width:30px; height:30px; color:var(--muted); opacity:.72; }
.empty-title{ font-size:14px; font-weight:700; }
.empty-hint{
  margin:0;
  font-size:13px;
  color:var(--muted);
  max-width:46ch;
  line-height:1.7;
}

/* ============ 项目 ============ */
.prj-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit, minmax(300px, 1fr));
  gap:16px;
}

.prj-card{
  padding:20px;
  display:flex;
  flex-direction:column;
  gap:12px;
}

.prj-head{ display:flex; flex-direction:column; gap:4px; }

.prj-title{
  margin:0;
  font-size:15.5px;
  font-weight:700;
  letter-spacing:-.01em;
}

.prj-meta{
  font-size:12.5px;
  color:var(--muted);
}

.tag-row{ display:flex; flex-wrap:wrap; gap:6px; }

.tag{
  font-size:11.5px;
  font-weight:600;
  padding:3px 9px;
  border-radius:7px;
  color:var(--brand);
  background:var(--surface-2);
  border:1px solid var(--border);
}

.prj-points{
  margin:0;
  padding-left:17px;
}
.prj-points li{
  font-size:13.5px;
  color:var(--muted);
  margin-bottom:6px;
  line-height:1.7;
}
.prj-points li:last-child{ margin-bottom:0; }
.prj-points li::marker{ color:var(--brand); }

/* ============ 技能 ============ */
.skill-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit, minmax(260px, 1fr));
  gap:16px;
}

.skill-card{ padding:18px 20px; }

.skill-group{
  margin:0 0 14px;
  font-size:14px;
  font-weight:800;
  display:flex;
  align-items:center;
  gap:8px;
}
.skill-group::before{
  content:"";
  width:7px; height:7px;
  border-radius:50%;
  background:var(--grad);
  box-shadow:0 0 0 3px rgba(79,70,229,.14);
  flex:0 0 auto;
}

.skill-row{ margin-bottom:13px; }
.skill-row:last-child{ margin-bottom:0; }

.skill-label{
  display:flex;
  justify-content:space-between;
  align-items:baseline;
  gap:10px;
  font-size:13px;
  margin-bottom:6px;
}
.skill-name{ color:var(--text); }
.skill-pct{
  color:var(--muted);
  font-size:12px;
  font-variant-numeric:tabular-nums;
}

.bar{
  height:6px;
  border-radius:99px;
  background:var(--surface-2);
  overflow:hidden;
}
.bar-fill{
  height:100%;
  width:0;
  border-radius:99px;
  background:linear-gradient(90deg,#4f46e5,#0ea5e9);
  transition:width .9s cubic-bezier(.22,.8,.3,1);
}

/* ============ 教育与证书 ============ */
.edu-grid{
  display:grid;
  grid-template-columns:1.3fr 1fr;
  gap:16px;
  align-items:start;
}

.edu-card{ padding:22px; }

.edu-school{
  display:flex;
  justify-content:space-between;
  align-items:baseline;
  gap:12px;
  flex-wrap:wrap;
}
.edu-school h3{
  margin:0;
  font-size:16.5px;
  font-weight:800;
  letter-spacing:-.01em;
}

.edu-badge{
  font-size:12px;
  font-weight:700;
  color:var(--brand);
  background:var(--surface-2);
  border:1px solid var(--border);
  padding:3px 10px;
  border-radius:99px;
  white-space:nowrap;
}

.edu-major{
  margin:8px 0 0;
  font-size:13.5px;
  font-weight:700;
  color:var(--brand);
}

.edu-meta{
  margin:6px 0 0;
  font-size:13px;
  color:var(--muted);
}

.course-row{
  display:flex;
  flex-wrap:wrap;
  gap:7px;
  margin-top:14px;
}

.course{
  font-size:12px;
  padding:4px 10px;
  border-radius:8px;
  background:var(--surface-2);
  border:1px solid var(--border);
  color:var(--muted);
  transition:color .18s ease, border-color .18s ease;
}
.course:hover{ color:var(--brand); border-color:var(--brand); }

.edu-notes{
  margin:16px 0 0;
  padding-left:17px;
}
.edu-notes li{
  font-size:13.5px;
  color:var(--muted);
  margin-bottom:6px;
  line-height:1.7;
}
.edu-notes li:last-child{ margin-bottom:0; }
.edu-notes li::marker{ color:var(--brand); }

.award-card{ padding:20px 22px; }

.award-title{
  margin:0 0 6px;
  font-size:14px;
  font-weight:800;
}

.award-item{
  display:flex;
  gap:12px;
  align-items:flex-start;
  padding:11px 0;
  border-bottom:1px dashed var(--border);
}
.award-item:last-child{ border-bottom:0; padding-bottom:0; }

.award-dot{
  width:8px; height:8px;
  border-radius:50%;
  margin-top:7px;
  flex:0 0 auto;
  background:var(--grad);
  box-shadow:0 0 0 3px rgba(79,70,229,.14);
}

.award-name{
  font-size:13.5px;
  font-weight:600;
  line-height:1.6;
}
.award-meta{
  font-size:12px;
  color:var(--muted);
}

/* ============ 照片墙 ============ */
.photo-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit, minmax(240px, 1fr));
  gap:16px;
}

.photo-card{
  overflow:hidden;
  display:flex;
  flex-direction:column;
  padding:0;
  cursor:zoom-in;
  position:relative;
}

.photo-thumb{
  position:relative;
  width:100%;
  aspect-ratio:4 / 3;
  overflow:hidden;
  background:
    linear-gradient(135deg, rgba(79,70,229,.10), rgba(14,165,233,.10)),
    var(--surface-2);
}

.photo-thumb img{
  width:100%;
  height:100%;
  object-fit:cover;
  object-position:center;
  display:block;
  transition:transform .4s cubic-bezier(.22,.8,.3,1), filter .3s ease;
}
.photo-card:hover .photo-thumb img{ transform:scale(1.06); }

.photo-thumb.is-contain img{ object-fit:contain; padding:10px; }
.photo-thumb.is-contain:hover img{ transform:scale(1.03); }

.photo-zoom{
  position:absolute;
  right:10px; top:10px;
  width:30px; height:30px;
  display:grid;
  place-items:center;
  border-radius:9px;
  background:rgba(15,23,42,.55);
  color:#fff;
  opacity:0;
  transform:translateY(-4px);
  transition:opacity .22s ease, transform .22s ease;
  pointer-events:none;
}
.photo-zoom svg{ width:15px; height:15px; display:block; }
.photo-card:hover .photo-zoom{ opacity:1; transform:none; }

.photo-cap{
  padding:12px 14px 14px;
  display:flex;
  flex-direction:column;
  gap:3px;
}
.photo-cap-title{
  font-size:13.5px;
  font-weight:700;
  line-height:1.5;
}
.photo-cap-meta{
  font-size:12px;
  color:var(--muted);
  line-height:1.5;
}

.photo-card.is-error{ display:none; }

/* ============ 灯箱 ============ */
.lightbox{
  position:fixed;
  inset:0;
  z-index:100;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:24px;
  background:rgba(6,10,20,.86);
  backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);
  opacity:0;
  visibility:hidden;
  transition:opacity .22s ease, visibility .22s;
}
.lightbox.show{ opacity:1; visibility:visible; }

.lightbox-figure{
  margin:0;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:14px;
  max-width:min(94vw, 940px);
  max-height:92vh;
  transform:scale(.96);
  transition:transform .26s cubic-bezier(.22,.8,.3,1);
}
.lightbox.show .lightbox-figure{ transform:none; }

.lightbox img{
  max-width:100%;
  max-height:78vh;
  border-radius:14px;
  object-fit:contain;
  box-shadow:0 30px 80px rgba(0,0,0,.55);
  background:var(--surface);
}

.lightbox-cap{
  color:rgba(255,255,255,.86);
  font-size:13.5px;
  font-weight:600;
  text-align:center;
  line-height:1.6;
}
.lightbox-cap span{
  display:block;
  font-size:12px;
  font-weight:400;
  opacity:.68;
  margin-top:3px;
}

.lightbox-close{
  position:absolute;
  top:18px; right:18px;
  width:42px; height:42px;
  display:grid;
  place-items:center;
  border-radius:12px;
  border:1px solid rgba(255,255,255,.22);
  background:rgba(255,255,255,.10);
  color:#fff;
  cursor:pointer;
  padding:0;
  transition:background .2s ease, transform .2s ease;
}
.lightbox-close:hover{ background:rgba(255,255,255,.2); transform:rotate(90deg); }
.lightbox-close svg{ width:18px; height:18px; display:block; }

/* ============ 页脚 ============ */
.footer{
  border-top:1px solid var(--border);
  margin-top:44px;
}
.footer-inner{
  max-width:1080px;
  margin:0 auto;
  padding:22px 20px 34px;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-wrap:wrap;
  gap:8px;
  font-size:12.5px;
  color:var(--muted);
}
.footer .sep{ opacity:.5; }

/* ============ 返回顶部 ============ */
.to-top{
  position:fixed;
  right:20px; bottom:24px;
  z-index:55;
  width:42px; height:42px;
  display:grid; place-items:center;
  border-radius:13px;
  border:1px solid var(--border);
  background:var(--surface);
  color:var(--text);
  font-size:17px;
  line-height:1;
  cursor:pointer;
  padding:0;
  box-shadow:var(--shadow);
  opacity:0;
  visibility:hidden;
  transform:translateY(10px);
  transition:opacity .22s ease, transform .22s ease, visibility .22s, box-shadow .22s ease;
}
.to-top.show{ opacity:1; visibility:visible; transform:none; }
.to-top:hover{ transform:translateY(-2px); box-shadow:var(--shadow-hover); }

/* ============ Toast ============ */
.toast{
  position:fixed;
  left:50%; bottom:30px;
  z-index:120;
  padding:10px 18px;
  border-radius:11px;
  font-size:13px;
  font-weight:600;
  color:#fff;
  background:rgba(15,23,42,.92);
  backdrop-filter:blur(8px);
  -webkit-backdrop-filter:blur(8px);
  box-shadow:0 12px 30px rgba(0,0,0,.28);
  opacity:0;
  visibility:hidden;
  pointer-events:none;
  transform:translate(-50%, 14px);
  transition:opacity .22s ease, transform .22s ease, visibility .22s;
  max-width:min(90vw, 420px);
  text-align:center;
}
[data-theme="dark"] .toast{
  background:rgba(232,238,251,.95);
  color:#0f172a;
}
.toast.show{
  opacity:1;
  visibility:visible;
  transform:translate(-50%, 0);
}

/* ============ 入场动画 ============ */
.reveal{ opacity:0; }

.reveal.in{
  animation:fadeUp .55s cubic-bezier(.22,.8,.3,1) both;
}

@keyframes fadeUp{
  from{ opacity:0; transform:translateY(16px); }
  to{ opacity:1; transform:none; }
}

      });
    }
    if (opts.on) {

    var kids = children === undefined ? [] : (Array.isArray(children) ? children : [children]);

  var toastEl = $('#toast');

  function toast(msg) {
    toastEl.textContent = msg;

  }

  function copyText(text, okMsg) {
    var done = function () { toast(okMsg || '已复制到剪贴板'); };
    var fail = function () { toast('复制失败，请手动复制'); };

    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(text).then(done).catch(function () {
        legacyCopy(text) ? done() : fail();
      });
      return;
    }
    legacyCopy(text) ? done() : fail();
  }

  function legacyCopy(text) {
    try {
      var ta = document.createElement('textarea');
      ta.value = text;
      ta.setAttribute('readonly', '');
      ta.style.position = 'fixed';
      ta.style.top = '-1000px';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      ta.setSelectionRange(0, text.length);
      var ok = document.execCommand('copy');
      document.body.removeChild(ta);
      return ok;
    } catch (e) {
      return false;
    }
  }

        }

      tabEls.push(tab);

    function applyFilter(id) {
      cards.forEach(function (c) {
        c.hidden = !(id === 'all' || c.getAttribute('data-cat') === id);
      });
    }

    tabEls.forEach(function (tab) {
      tab.addEventListener('click', function () {
        tabEls.forEach(function (t) {
          var on = t === tab;
          t.setAttribute('aria-selected', on ? 'true' : 'false');
          t.tabIndex = on ? 0 : -1;
        });
        applyFilter(tab.getAttribute('data-filter'));
      });

      tab.addEventListener('keydown', function (e) {
        var idx = tabEls.indexOf(tab);
        var next = -1;
        if (e.key === 'ArrowRight' || e.key === 'ArrowDown') next = (idx + 1) % tabEls.length;
        else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') next = (idx - 1 + tabEls.length) % tabEls.length;
        else if (e.key === 'Home') next = 0;
        else if (e.key === 'End') next = tabEls.length - 1;
        if (next >= 0) {
          e.preventDefault();
          tabEls[next].focus();
          tabEls[next].click();
        }
      });
    });

    root.appendChild(tabbar);
    root.appendChild(grid);
  }

  /* =========================================================
     10. Tabs 通用逻辑（ARIA + 键盘）
     ========================================================= */
  function initTabs(tabs, panels) {
    function select(i) {
      tabs.forEach(function (t, j) {
        var on = i === j;
        t.setAttribute('aria-selected', on ? 'true' : 'false');
        t.tabIndex = on ? 0 : -1;
        panels[j].hidden = !on;
      });
    }

    tabs.forEach(function (tab, i) {
      tab.addEventListener('click', function () { select(i); });

      tab.addEventListener('keydown', function (e) {
        var next = -1;
        if (e.key === 'ArrowRight' || e.key === 'ArrowDown') next = (i + 1) % tabs.length;
        else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') next = (i - 1 + tabs.length) % tabs.length;
        else if (e.key === 'Home') next = 0;
        else if (e.key === 'End') next = tabs.length - 1;
        if (next >= 0) {
          e.preventDefault();
          select(next);
          tabs[next].focus();
        }
      });
    });
  }

          ])
        );

  function animateBars() {
    var fills = $$('.bar-fill');
    if (!fills.length) return;

    var reduce = false;
    try { reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { /* ignore */ }

    var run = function (el) {
      el.style.width = el.getAttribute('data-pct') + '%';
    };

    if (reduce || !('IntersectionObserver' in window)) {
      fills.forEach(run);
      return;
    }

    var io = new IntersectionObserver(function (entries) {
      entries.forEach(function (en) {
        if (en.isIntersecting) {
          run(en.target);
          io.unobserve(en.target);
        }
      });
    }, { threshold: 0.2 });

    fills.forEach(function (f) { io.observe(f); });
  }

          h('div', {}, [
            h('div', { className: 'award-name', text: clean(a.name) }),
            valid(a.meta) ? h('div', { className: 'award-meta', text: clean(a.meta) }) : null
          ])
        ])
      );
    });
  }

  /* =========================================================
     13. 照片墙 + 灯箱
     ========================================================= */
  function renderPhotos() {
    var grid = $('#photoGrid');
    var section = $('#gallery');
    var list = (resume.photos || []).filter(function (p) { return p && p.src; });

    if (!list.length) {
      section.style.display = 'none';
      return;
    }

    var cards = [];

    list.forEach(function (p) {
      var img = h('img', {
        attrs: {
          src: p.src,
          alt: clean(p.title) || '证书照片',
          loading: 'lazy',
          decoding: 'async'
        }
      });

      var thumb = h('div', {
        className: 'photo-thumb' + (p.fit === 'contain' ? ' is-contain' : '')
      }, [
        img,
        h('span', { className: 'photo-zoom', html: ICONS.zoom, attrs: { 'aria-hidden': 'true' } })
      ]);

      var cap = h('div', { className: 'photo-cap' }, [
        h('div', { className: 'photo-cap-title', text: clean(p.title) }),
        valid(p.meta) ? h('div', { className: 'photo-cap-meta', text: clean(p.meta) }) : null
      ]);

      var card = h('button', {
        className: 'card photo-card reveal',
        attrs: {
          type: 'button',
          'aria-label': '查看大图：' + (clean(p.title) || '照片')
        },
        on: {
          click: function () { openLightbox(p); }
        }
      }, [thumb, cap]);

      img.addEventListener('error', function () {
        card.classList.add('is-error');
        if (cards.every(function (c) { return c.classList.contains('is-error'); })) {
          section.style.display = 'none';
        }
      });

      cards.push(card);
      grid.appendChild(card);
    });
  }

  var lightbox = $('#lightbox');
  var lightboxImg = $('#lightboxImg');
  var lightboxCap = $('#lightboxCap');
  var lastFocused = null;

  function openLightbox(p) {
    lastFocused = document.activeElement;

    lightboxImg.src = p.src;
    lightboxImg.alt = clean(p.title) || '照片预览';

    lightboxCap.textContent = '';
    lightboxCap.appendChild(document.createTextNode(clean(p.title) || ''));
    if (valid(p.meta)) {
      lightboxCap.appendChild(h('span', { text: clean(p.meta) }));
    }

    lightbox.hidden = false;
    // 触发过渡
    requestAnimationFrame(function () {
      lightbox.classList.add('show');
    });
    document.body.style.overflow = 'hidden';
    $('#lightboxClose').focus();
  }

  function closeLightbox() {
    lightbox.classList.remove('show');
    document.body.style.overflow = '';

    var done = function () {
      lightbox.hidden = true;
      lightboxImg.removeAttribute('src');
      lightbox.removeEventListener('transitionend', done);
    };

    var reduce = false;
    try { reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { /* ignore */ }

    if (reduce) {
      done();
    } else {
      lightbox.addEventListener('transitionend', done);
      // 兜底
      setTimeout(done, 400);
    }

    if (lastFocused && typeof lastFocused.focus === 'function') {
      lastFocused.focus();
    }
  }

  function initLightbox() {
    $('#lightboxClose').addEventListener('click', closeLightbox);

    lightbox.addEventListener('click', function (e) {
      if (e.target === lightbox) closeLightbox();
    });

    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape' && lightbox.classList.contains('show')) {
        closeLightbox();
      }
    });

    // 焦点锁定
    lightbox.addEventListener('keydown', function (e) {
      if (e.key !== 'Tab') return;
      e.preventDefault();
      $('#lightboxClose').focus();
    });
  }

  /* =========================================================
     14. 空状态
     ========================================================= */
  function buildEmpty(title, hint) {
    return h('div', { className: 'empty' }, [
      h('span', { html: ICONS.empty }),
      h('div', { className: 'empty-title', text: title }),
      hint ? h('p', { className: 'empty-hint', text: hint }) : null
    ]);
  }

  /* =========================================================
     15. 入场动画
     ========================================================= */
  function initReveal() {
    var items = $$('.reveal');
    if (!items.length) return;

    var reduce = false;
    try { reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { /* ignore */ }

    if (reduce || !('IntersectionObserver' in window)) {
      items.forEach(function (el) { el.classList.add('in'); });
      return;
    }

    var io = new IntersectionObserver(function (entries) {
      entries.forEach(function (en, i) {
        if (en.isIntersecting) {
          var el = en.target;
          setTimeout(function () { el.classList.add('in'); }, Math.min(i * 55, 240));
          io.unobserve(el);
        }
      });
    }, { threshold: 0.12, rootMargin: '0px 0px -40px 0px' });

    items.forEach(function (el) { io.observe(el); });
  }

  /* =========================================================
     16. 导航高亮 / 返回顶部 / 打印
     ========================================================= */
  function initNav() {
    var links = $$('.nav-link');
    var sections = $$('main section[id]');

    if ('IntersectionObserver' in window && sections.length) {
      var io = new IntersectionObserver(function (entries) {
        entries.forEach(function (en) {
          if (en.isIntersecting) {
            var id = '#' + en.target.id;
            links.forEach(function (l) {
              l.classList.toggle('active', l.getAttribute('href') === id);
            });
          }
        });
      }, { rootMargin: '-72px 0px -68% 0px', threshold: 0 });

      sections.forEach(function (s) { io.observe(s); });
    }
  }

  function initToTop() {
    var btn = $('#toTop');
    var ticking = false;

    function update() {
      btn.classList.toggle('show', window.scrollY > 420);
      ticking = false;
    }

    window.addEventListener('scroll', function () {
      if (!ticking) {
        ticking = true;
        window.requestAnimationFrame(update);
      }
    }, { passive: true });

    btn.addEventListener('click', function () {
      var reduce = false;
      try { reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { /* ignore */ }
      window.scrollTo({ top: 0, behavior: reduce ? 'auto' : 'smooth' });
    });

    update();
  }

  function initPrint() {
    $('#printBtn').addEventListener('click', function () {
      window.print();
    });
  }

  function initFooter() {
    var now = new Date();
    $('#year').textContent = now.getFullYear();
    $('#updated').textContent = now.getFullYear() + '-' +
      String(now.getMonth() + 1).padStart(2, '0') + '-' +
      String(now.getDate()).padStart(2, '0');
  }

  /* =========================================================
     17. 启动
     ========================================================= */
  function boot() {
    initAvatar();
    renderHero();
    renderHighlights();
    renderExperience();
    renderProjects();
    renderSkills();
    renderEducation();
    renderPhotos();

    initLightbox();
    initNav();
    initToTop();
    initPrint();
    initFooter();
    initReveal();
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', boot);
  } else {
    boot();
  }
})();
</script>
</body>
